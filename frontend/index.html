<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>meek — comment toxicity check</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <header class="header">
      <h1>meek</h1>
      <p class="subtitle">Paste a comment. See how toxic a moderator model thinks it is.</p>
    </header>

    <section class="panel">
      <div class="top-controls">
        <div class="mode-toggle" role="tablist" aria-label="Input Mode">
          <button type="button" class="mode-btn active" data-mode="single">Single</button>
          <button type="button" class="mode-btn" data-mode="batch">Batch</button>
        </div>
        <div class="lang-row">
          <div class="lang-toggle" role="radiogroup" aria-label="Language selection">
            <button type="button" class="lang-btn active" data-lang="auto" aria-pressed="true">Auto</button>
            <button type="button" class="lang-btn" data-lang="en" aria-pressed="false">English</button>
            <button type="button" class="lang-btn" data-lang="sn" aria-pressed="false">Shona</button>
          </div>
        </div>
      </div>
      <label class="field-label" id="input-label" for="comment-input">Comment text</label>
      <textarea
        id="comment-input"
        placeholder="e.g. You are a wonderful person, thank you for helping me!"
        rows="6"
        maxlength="5000"
      ></textarea>
      <div class="controls">
        <span id="char-count" class="char-count">0 / 5000</span>
        <button id="check-btn" type="button">Check comment</button>
      </div>
    </section>

    <section id="result-panel" class="panel result-panel" hidden>
      <div id="verdict" class="verdict"></div>
      <div id="scores" class="scores"></div>
    </section>

    <section id="error-panel" class="panel error-panel" hidden>
      <p id="error-text"></p>
    </section>

    <footer class="footer">
      <span id="model-name">model: —</span>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
